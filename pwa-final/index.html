<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#7fb86d" />
  <meta name="description" content="兮兮菜单" />
  <title>兮兮菜单</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg" />
  <style>
    :root {
      --green: #7fb86d;
      --green-deep: #4c8a4b;
      --bg1: #f7f2ea;
      --bg2: #e6f0dd;
      --text: #273128;
      --muted: #5f675d;
      --card: rgba(255,255,255,0.75);
      --shadow: rgba(59, 88, 57, 0.18);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 18px;
    }

    .app-shell {
      width: min(92vw, 360px);
      background: var(--card);
      border-radius: 28px;
      box-shadow: 0 18px 40px var(--shadow);
      backdrop-filter: blur(10px);
      padding: 26px 20px 22px;
      text-align: center;
    }

    .logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #dff3c7, #7fb86d);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.7);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      letter-spacing: 0.04em;
    }

    p {
      margin: 12px 0 18px;
      color: var(--muted);
      font-size: 0.96rem;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--green), var(--green-deep));
      color: white;
      padding: 12px 18px;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      box-shadow: 0 12px 24px rgba(79, 140, 75, 0.22);
    }

    .btn.secondary {
      background: rgba(255,255,255,0.5);
      color: var(--text);
      border: 1px solid rgba(39,49,40,0.08);
      box-shadow: none;
    }

    .install-btn {
      display: none;
    }

    .install-btn.visible {
      display: inline-flex;
    }

    .note {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="logo" aria-hidden="true">
      <img src="./icons/icon-192.svg" alt="兮兮菜单图标" />
    </div>

    <h1>兮兮菜单</h1>
    <p>这是专门用于安装的菜单入口，支持 Android / 鸿蒙浏览器直接安装到桌面。</p>

    <div class="actions">
      <button class="btn install-btn" id="installBtn">安装到桌面</button>
      <a class="btn secondary" href="https://punk.pythonanywhere.com/" target="_blank" rel="noopener">打开菜单</a>
    </div>

    <div class="note">如果浏览器没有弹出安装提示，也可以手动使用“添加到主屏幕”。</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredPrompt = event;
      installBtn.classList.add('visible');
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) {
        alert('当前浏览器未提供安装提示，请使用“添加到主屏幕”功能。');
        return;
      }
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.classList.remove('visible');
    });
  </script>
</body>
</html>
