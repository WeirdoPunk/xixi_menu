<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理 · 兮兮的菜单</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            padding: 10px 0 20px;
            background: #f2ede6;
            color: #2f2a28;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .container {
            width: min(460px, 100%);
            margin: 0 auto;
            padding: 14px 10px 20px;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 4px 2px 16px;
        }
        h1 { font-size: 1.35rem; }
        .back-link {
            padding: 8px 12px;
            border-radius: 999px;
            background: #fffdfb;
            color: #4f7a49;
            font-size: 0.78rem;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
        }
        .card {
            background: #fffdfb;
            border: 1px solid rgba(0,0,0,0.04);
            border-radius: 18px;
            padding: 14px 12px;
            margin-bottom: 14px;
            box-shadow: 0 5px 14px rgba(60,42,28,0.05);
        }
        .card h2 {
            margin-bottom: 12px;
            font-size: 1rem;
        }
        .profile-preview {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .avatar {
            width: 64px;
            height: 64px;
            flex: 0 0 64px;
            border-radius: 50%;
            object-fit: cover;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #dff3c7, #8cc17d);
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .muted { color: #8a8179; font-size: 0.78rem; }
        label {
            display: block;
            margin: 10px 0 5px;
            color: #655d57;
            font-size: 0.78rem;
            font-weight: 600;
        }
        input[type="text"], input[type="file"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #e7dfd7;
            border-radius: 12px;
            background: #fbf8f5;
            font-size: 0.86rem;
        }
        button {
            width: 100%;
            margin-top: 12px;
            padding: 11px 16px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #8cc17d, #6aab68);
            color: white;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
        }
        .hint {
            margin-top: 8px;
            color: #948b84;
            font-size: 0.72rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="topbar">
        <h1>⚙️ 管理资料与菜品</h1>
        <a class="back-link" href="{{ url_for('index') }}">返回主页</a>
    </div>

    <section class="card">
        <h2>👤 用户头像</h2>
        <div class="profile-preview">
            {% if profile.avatar_path %}
            <img class="avatar" src="{{ url_for('static', filename='uploads/' + profile.avatar_path.split('/')[-1]) }}" alt="{{ profile.nickname }}的头像">
            {% else %}
            <div class="avatar" aria-label="默认头像">{{ profile.nickname[:1] }}</div>
            {% endif %}
            <div>
                <strong>{{ profile.nickname }}</strong>
                <div class="muted">头像和昵称会显示在资料中</div>
            </div>
        </div>
        <form method="POST" action="{{ url_for('update_profile') }}" enctype="multipart/form-data">
            <label for="nickname">昵称</label>
            <input id="nickname" type="text" name="nickname" value="{{ profile.nickname }}" maxlength="30" placeholder="输入昵称">
            <label for="avatar">头像图片</label>
            <input id="avatar" type="file" name="avatar" accept=".png,.jpg,.jpeg,.gif,.webp,.bmp,image/png,image/jpeg,image/gif,image/webp,image/bmp">
            <button type="submit">保存用户资料</button>
        </form>
    </section>

    <section class="card">
        <h2>🍽️ 上传菜品</h2>
        <form method="POST" action="{{ url_for('add_dish') }}" enctype="multipart/form-data">
            <label for="dishName">菜名</label>
            <input id="dishName" type="text" name="dish_name" placeholder="例如：清炒时蔬" required>
            <label for="dishImage">菜品图片</label>
            <input id="dishImage" type="file" name="dish_image" accept=".png,.jpg,.jpeg,.gif,.webp,.bmp,image/png,image/jpeg,image/gif,image/webp,image/bmp" required>
            <label for="dishCategory">分类</label>
            <select id="dishCategory" name="category">
                {% for cat in categories %}
                <option value="{{ cat }}">{{ cat }}</option>
                {% endfor %}
            </select>
            <button type="submit">上传菜品</button>
            <div class="hint">支持 PNG、JPG/JPEG、GIF、WEBP、BMP 格式。上传后会返回此管理页。</div>
        </form>
    </section>
</div>
</body>
</html>
